<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌工作区 · 影像工作台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#272a26;background:#f4f4f0}*{box-sizing:border-box}body{margin:0}header{padding:24px 5vw;background:#242923;color:#f7f8f3;display:flex;justify-content:space-between;align-items:center}header strong{font-size:20px}header a{font-size:13px;color:#f1d398}main{max-width:1000px;margin:48px auto;padding:0 24px 60px}h1{font-size:30px;margin:0 0 12px}h2{font-size:20px;margin:32px 0 16px}p{line-height:1.7;color:#69735f}#spaces{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.space{display:flex;gap:12px;align-items:center;padding:16px;background:white;border:1px solid #e4e6de;border-radius:8px;color:inherit;text-decoration:none;min-width:190px}.symbol{display:grid;place-items:center;background:#e6bb70;color:#3d321e;width:42px;height:42px;border-radius:8px;font-weight:600}.space small{display:block;margin-top:6px;color:#69735f}.setup{max-width:650px;background:white;padding:28px;border-radius:12px;border:1px solid #e4e6de}label{display:block;font-weight:600;margin:0 0 22px}input,textarea{display:block;width:100%;margin-top:9px;padding:13px;background:#fafbf7;color:#272a26;border:1px solid #d7ddce;border-radius:7px;font:inherit}textarea{resize:vertical;min-height:88px}.row{display:grid;grid-template-columns:1fr 100px;gap:16px}button{background:#e6bb70;color:#322e21;border:0;border-radius:7px;padding:14px 20px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a:focus-visible,button:focus-visible{outline:3px solid #b88c3b;outline-offset:3px}input:focus,textarea:focus{outline:2px solid #b88c3b}#error{color:#a83a28}#environment{margin:22px 0;font-size:13px}.hint{font-size:13px;margin:0 0 22px}.help{margin-top:28px;font-size:14px}a{color:#64501f}@media(max-width:600px){main{margin-top:30px}.setup{padding:20px}.row{grid-template-columns:1fr 80px}header strong{font-size:17px}}
</style></head><body><header><strong>影像工作台</strong><a href="/tutorial/">使用教程 ↗</a></header><main><h1>你的品牌，你的工作区。</h1><p>相机品牌、摄影分享、产品介绍或日常内容，都可以自行设定。<br>每个工作区独立保存素材、草稿和平台账号，所有工作区共用一个 API Key。</p><div id="environment"></div><div id="spaces"></div><h2>新增品牌工作区</h2><form id="workspace-form" class="setup"><div class="row"><label>品牌 / 工作区名称<input name="name" placeholder="例如：我的摄影日记" maxlength="40" required autocomplete="organization"></label><label>图标文字<input name="icon" placeholder="A" maxlength="2" aria-describedby="icon-help"></label></div><p id="icon-help" class="hint">图标可用 1–2 个字母或汉字；留空时使用名称首字。</p><label>内容方向<textarea name="content_direction" placeholder="例如：城市街拍、旅行影像与拍摄心得" maxlength="500"></textarea></label><label>文案语气<textarea name="tone" placeholder="例如：自然、真实、简洁，不夸大产品效果" maxlength="2000"></textarea></label><p class="hint">创建后可在「品牌与 AI 设置」修改。每个工作区支持小红书、视频号、抖音各一个账号。</p><p id="error" role="alert" hidden></p><button id="create-space">创建并进入工作台</button></form><p class="help">第一次使用：创建工作区 → 设置 AI 服务 → 连接平台账号 → 上传视频并发布。<br><a href="/tutorial/">打开图文教程</a></p></main><script>
const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch('/api/workspaces');const data=await r.json();document.querySelector('#spaces').innerHTML=data.workspaces.map(w=>`<a class="space" href="/b/${w.id}/"><span class="symbol">${html(w.icon)}</span><span><strong>${html(w.name)}</strong><small>${html(w.content_direction||'进入工作台')}</small></span></a>`).join('');const missing=data.environment.missing;document.querySelector('#environment').textContent=missing.length?'运行环境待补齐：'+missing.join('、')+'。请先运行安装包中的「安装运行环境.command」。':'运行环境已准备好。';}
document.querySelector('#workspace-form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#create-space'),error=document.querySelector('#error');button.disabled=true;error.hidden=true;try{const r=await fetch('/api/workspaces',{method:'POST',headers:{'Content-Type':'application/json','X-Hasu-Client':'studio'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const data=await r.json();if(!r.ok)throw new Error(data.error);location.assign('/b/'+data.id+'/#settings');}catch(err){error.textContent=err.message;error.hidden=false;button.disabled=false;}};load().catch(()=>{document.querySelector('#environment').textContent='工作台尚未响应，请重新启动。';});
</script></body></html>
